<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gaia Cockpit</title>
<style>
:root { color-scheme: light }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: #fafaf9;
  color: #1c1917;
  font-size: 14px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
.layout { display: flex; height: 100vh; }
aside {
  width: 220px;
  background: #f5f5f4;
  border-right: 1px solid #d6d3d1;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.brand { padding: 20px 16px; border-bottom: 1px solid #d6d3d1; }
.brand .label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: #78716c; }
.brand h1 { font-size: 16px; margin-top: 2px; color: #1c1917; }
.brand .version { font-size: 10px; color: #78716c; margin-top: 2px; font-variant-numeric: tabular-nums; }
nav { padding: 8px 0; flex: 1; }
nav button {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; background: none; border: none; text-align: left;
  font-size: 13px; color: #44403c; cursor: pointer; transition: background 0.1s;
  font-family: inherit;
}
nav button:hover { background: #e7e5e4; }
nav button.active { background: #1c1917; color: #fff; }
nav button .stub { margin-left: auto; font-size: 9px; color: #a8a29e; text-transform: uppercase; }
.source { padding: 12px 16px; border-top: 1px solid #d6d3d1; font-size: 10px; color: #78716c; line-height: 1.5; }
main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
header.view-header { padding: 18px 24px 12px; border-bottom: 1px solid #d6d3d1; background: white; }
.view-header h2 { font-size: 18px; font-weight: 600; display: inline; }
.view-header .desc { color: #78716c; font-size: 12px; margin-left: 8px; }
.tabs { display: flex; background: white; border-bottom: 1px solid #d6d3d1; padding: 0 24px; }
.tab {
  padding: 10px 16px; font-size: 12px; color: #78716c; border: none;
  background: none; border-bottom: 2px solid transparent; cursor: pointer; font-family: inherit;
}
.tab.active { color: #1c1917; font-weight: 500; border-bottom-color: #1c1917; }
.tab .count { color: #a8a29e; font-variant-numeric: tabular-nums; margin-left: 4px; }
.filters {
  display: flex; gap: 12px; padding: 10px 24px; background: #fafaf9;
  border-bottom: 1px solid #e7e5e4; font-size: 12px; align-items: center;
}
.filters .hint { color: #78716c; }
.filters .grow { flex: 1; }
.filters select {
  background: white; border: 1px solid #d6d3d1; padding: 4px 8px;
  font-size: 12px; color: #44403c; font-family: inherit;
}
.scroll { flex: 1; overflow-y: auto; background: white; }
.item { padding: 12px 24px; border-bottom: 1px solid #e7e5e4; transition: background 0.05s; }
.item:hover { background: #fafaf9; }
.item .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.item .title {
  font-size: 13px; font-weight: 500; color: #1c1917; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item .title.wrap { white-space: normal; }
.item .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.tag { font-size: 10px; padding: 2px 8px; border: 1px solid; }
.tag-personal { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
.tag-professional { background: #eff6ff; color: #1e40af; border-color: #bfdbfe; }
.tag-family { background: #fff1f2; color: #9f1239; border-color: #fecdd3; }
.tag-ventures { background: #f5f3ff; color: #5b21b6; border-color: #ddd6fe; }
.tag-meta { background: #f5f5f4; color: #57534e; border-color: #d6d3d1; }
.tag-other { background: #fafaf9; color: #57534e; border-color: #d6d3d1; }
.type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #78716c; }
.due { font-size: 10px; color: #b45309; }
.next { font-size: 12px; color: #57534e; margin-top: 4px; line-height: 1.4; }
.next .arrow { color: #a8a29e; }
.next.italic { font-style: italic; }
.staleness { font-size: 11px; color: #a8a29e; font-variant-numeric: tabular-nums; white-space: nowrap; }
.staleness.warn { color: #b45309; }
.staleness.bad { color: #b91c1c; }
.empty { padding: 32px; text-align: center; color: #78716c; font-size: 13px; }
.legacy { font-size: 9px; color: #c2410c; text-transform: uppercase; }
.stub-view {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #fafaf9; color: #78716c; font-size: 14px;
}
.loading, .error-state {
  display: flex; align-items: center; justify-content: center; height: 100vh;
  flex-direction: column; gap: 12px; color: #78716c;
}
.error-state .box { background: white; border: 1px solid #d6d3d1; padding: 24px; max-width: 400px; }
.error-state h3 { color: #1c1917; margin-bottom: 8px; font-size: 14px; }
.error-state .msg {
  font-family: ui-monospace, monospace; font-size: 11px; background: #fafaf9;
  border: 1px solid #e7e5e4; padding: 8px; margin: 12px 0; word-break: break-word;
}
.error-state button {
  background: #1c1917; color: white; border: none; padding: 10px 16px;
  font-size: 13px; cursor: pointer; font-family: inherit;
}
a.title { color: #1c1917; text-decoration: none; }
a.title:hover { color: #1d4ed8; }
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando vault…</div></div>
<script>
'use strict';

// ============================================================
// STATE
// ============================================================

const state = {
  view: 'resurface',
  tab: 'captured',
  sortMode: 'oldest',
  domainFilter: 'all',
  data: null,
  error: null,
  loading: true,
  debug: null,  // raw response sample for diagnosis
};

const STATUS_DIRS = ['prioritized', 'active', 'captured', 'postponed', 'closed'];

// ============================================================
// PARSING
// ============================================================

function getBaseName(path) {
  const parts = path.replace(/\\/g, '/').split('/');
  return parts[parts.length - 1];
}

function parseFilename(name) {
  const base = name.replace(/\.md$/, '');
  const parts = base.split('-');
  if (parts.length >= 5 && parts[0].length === 6 && /^\d{6}$/.test(parts[0])) {
    const y = parts[0];
    return {
      schema: 'v3',
      filename_date: '20' + y.slice(0, 2) + '-' + y.slice(2, 4) + '-' + y.slice(4, 6),
      domain: parts[1],
      subdomain: parts[2] === parts[1] ? '' : parts[2],
      type: parts[3],
      subject: parts.slice(4).join('-'),
    };
  }
  if (parts.length >= 2) {
    return {
      schema: 'legacy',
      filename_date: null,
      domain: parts[0],
      subdomain: '',
      type: null,
      subject: parts.slice(1).join('-'),
    };
  }
  return { schema: 'unknown' };
}

function parseNextLine(content) {
  const m = content.match(/^next:[ \t]*(.+?)$/m);
  if (!m) return null;
  const v = m[1].trim();
  return v && v !== '—' ? v : null;
}

function parseItemsSection(content, subject) {
  const m = content.match(/(?:^|\n)##\s+Items\s*\n([\s\S]*?)(?=\n##\s+|$)/);
  if (!m) return [];
  const lines = m[1].split('\n').map(l => l.trim()).filter(l => l.startsWith('- '));
  return lines.map(line => {
    if (subject === 'capture-inbox') {
      const mm = line.match(/^-\s*(?:\[[^\]]*\]\s*)?(.+?)(?:\s+\*(?:→\s*\?\s*)?(.+?)\*)?$/);
      if (mm) return { text: mm[1].trim(), context: (mm[2] || '').trim() };
    }
    if (subject === 'revisit-inbox') {
      const mm = line.match(/^-\s*(\S+?)(?:\s+\*\(added\s+([^,]+?)(?:,\s*(.*?))?\)\*)?$/);
      if (mm) return { url: mm[1].trim(), added: (mm[2] || '').trim(), context: (mm[3] || '').trim() };
    }
    return { text: line.replace(/^-\s*/, '').trim() };
  });
}

function parseThread(note, statusDir) {
  const fn = parseFilename(getBaseName(note.path));
  const fm = note.frontmatter || {};
  const content = note.content || '';
  return {
    file: getBaseName(note.path).replace(/\.md$/, ''),
    status_dir: statusDir,
    schema: fn.schema || 'unknown',
    domain: fm.domain || fn.domain,
    subdomain: fm.subdomain || fn.subdomain || '',
    type: fm.type || fn.type,
    subject: fn.subject || getBaseName(note.path).replace(/\.md$/, ''),
    created_on: fm.created_on || fm.created || fn.filename_date,
    updated_on: fm.updated_on || fm.updated,
    status: fm.status || statusDir,
    due: fm.due,
    next: parseNextLine(content),
    content,
  };
}

// ============================================================
// LOAD
// ============================================================

// Defensive unwrap: Cowork may wrap MCP responses in various shapes.
function unwrapMcp(raw) {
  if (raw == null) return { notes: [] };
  // Error envelope
  if (raw.isError === true) return { notes: [], _error: raw };
  // Already in expected shape
  if (Array.isArray(raw.notes)) return raw;
  // String-encoded JSON
  if (typeof raw === 'string') {
    try { return unwrapMcp(JSON.parse(raw)); } catch { return { notes: [], _raw: raw }; }
  }
  // Raw MCP protocol: { content: [{ type: 'text', text: '<json>' }] }
  if (Array.isArray(raw.content) && raw.content[0]?.text) {
    try { return unwrapMcp(JSON.parse(raw.content[0].text)); } catch { return { notes: [], _raw: raw }; }
  }
  // Nested
  if (raw.result) return unwrapMcp(raw.result);
  if (raw.data) return unwrapMcp(raw.data);
  return { notes: [], _raw: raw };
}

// Diagnostic probes — try variations and report which works.
async function diagnose() {
  const probes = [
    {
      label: '1. now() — no args, sanity check',
      call: () => window.cowork.callMcpTool('mcp__aae-mcp-3_1__now', {}),
    },
    {
      label: '2. read_folder vault-relative no-space path',
      call: () => window.cowork.callMcpTool('mcp__aae-mcp-3_1__read_folder', { path: '2 Agents/Gaia/inbox' }),
    },
    {
      label: '3. read_folder absolute path with backslashes',
      call: () => window.cowork.callMcpTool('mcp__aae-mcp-3_1__read_folder', { path: 'C:\\Users\\tdsnit\\Documents\\Obsidian Vault\\1 OFP\\Threads\\prioritized' }),
    },
    {
      label: '4. read_folder absolute path with forward slashes',
      call: () => window.cowork.callMcpTool('mcp__aae-mcp-3_1__read_folder', { path: 'C:/Users/tdsnit/Documents/Obsidian Vault/1 OFP/Threads/prioritized' }),
    },
    {
      label: '5. read_folder vault-relative with space (original)',
      call: () => window.cowork.callMcpTool('mcp__aae-mcp-3_1__read_folder', { path: '1 OFP/Threads/prioritized' }),
    },
  ];
  const results = [];
  for (const p of probes) {
    let entry = { label: p.label };
    try {
      const r = await p.call();
      entry.ok = !r?.isError;
      entry.preview = JSON.stringify(r).slice(0, 300);
      entry.isError = r?.isError === true;
    } catch (e) {
      entry.ok = false;
      entry.threw = String(e);
    }
    results.push(entry);
  }
  return results;
}

async function loadData() {
  state.loading = true;
  state.error = null;
  state.debug = null;
  render();

  // Run diagnostics first — surface in debug pane regardless of outcome
  let probeResults = null;
  try {
    probeResults = await diagnose();
  } catch (e) {
    probeResults = [{ label: 'diagnose threw', threw: String(e) }];
  }

  try {
    const results = await Promise.all(
      STATUS_DIRS.map(d =>
        window.cowork.callMcpTool('mcp__aae-mcp-3_1__read_folder', { path: '1 OFP/Threads/' + d })
      )
    );
    const data = {
      generated_at: new Date().toISOString(),
      threads: {},
      special: {},
    };
    let totalNotes = 0;
    let firstRaw = null;
    STATUS_DIRS.forEach((dir, i) => {
      const unwrapped = unwrapMcp(results[i]);
      if (firstRaw === null && unwrapped._raw) firstRaw = { dir, raw: unwrapped._raw };
      const notes = unwrapped.notes || [];
      totalNotes += notes.length;
      data.threads[dir] = notes.map(n => parseThread(n, dir));
      data.threads[dir].forEach(t => {
        if (t.type === 'special') {
          const items = parseItemsSection(t.content, t.subject);
          const key = t.subject.replace(/-/g, '_');
          data.special[key] = items;
        }
      });
    });
    state.data = data;
    if (totalNotes === 0) {
      state.debug = {
        message: 'Nenhuma note encontrada. Veja diagnostic abaixo.',
        sampleResponse: firstRaw || results[0],
        rawType: typeof results[0],
        rawKeys: results[0] && typeof results[0] === 'object' ? Object.keys(results[0]) : null,
        probes: probeResults,
      };
    }
  } catch (e) {
    state.error = e.message || String(e);
    state.debug = { message: 'callMcpTool threw', error: String(e), probes: probeResults };
  }
  state.loading = false;
  render();
}

// ============================================================
// HELPERS
// ============================================================

function daysSince(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return Math.floor((new Date() - d) / 86400000);
}

function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function stalenessHTML(days) {
  if (days === null) return '<span class="staleness">—</span>';
  let cls = 'staleness';
  let suffix = '';
  if (days >= 30) { cls += ' warn'; suffix = ' ⚠'; }
  if (days >= 60) { cls += ' bad'; suffix = ' ⚠⚠'; }
  return '<span class="' + cls + '">' + days + 'd' + suffix + '</span>';
}

function prettyTitle(t) {
  return (t.subject || t.file).replace(/-/g, ' ');
}

const KNOWN_DOMAINS = ['personal', 'professional', 'family', 'ventures', 'meta'];

function tagClass(domain) {
  return KNOWN_DOMAINS.indexOf(domain) >= 0 ? 'tag-' + domain : 'tag-other';
}

function tagLabel(t) {
  if (!t.domain) return '—';
  if (t.subdomain && t.subdomain !== t.domain && t.subdomain !== '') {
    return t.domain + '/' + t.subdomain;
  }
  return t.domain;
}

// ============================================================
// RENDER
// ============================================================

function render() {
  const root = document.getElementById('app');
  if (state.loading) {
    root.innerHTML = '<div class="loading">Carregando vault…</div>';
    return;
  }
  if (state.error) {
    root.innerHTML = renderError();
  } else {
    root.innerHTML = renderApp();
  }
  attach();
}

function renderError() {
  return `
    <div class="error-state">
      <div class="box">
        <h3>Erro carregando dados</h3>
        <div class="msg">${escapeHTML(state.error)}</div>
        <button data-action="retry">Retry</button>
      </div>
    </div>
  `;
}

function renderApp() {
  return `
    <div class="layout">
      ${renderSidebar()}
      <main>
        ${state.debug ? renderDebug() : ''}
        ${state.view === 'resurface' ? renderResurface() : renderStub()}
      </main>
    </div>
  `;
}

function renderDebug() {
  const d = state.debug;
  const probesHTML = (d.probes || []).map(p => `
    <div style="padding: 6px 0; border-top: 1px dashed #fcd34d;">
      <div style="font-weight: 500; color: ${p.ok ? '#166534' : '#991b1b'};">
        ${p.ok ? '✓' : '✗'} ${escapeHTML(p.label)}
      </div>
      <pre style="background: white; border: 1px solid #fcd34d; padding: 6px; margin-top: 4px; font-size: 10px; max-height: 80px; overflow: auto; white-space: pre-wrap; word-break: break-all;">${escapeHTML(p.threw || p.preview || '')}</pre>
    </div>
  `).join('');
  return `
    <div style="background: #fef3c7; border-bottom: 1px solid #fcd34d; padding: 12px 24px; font-size: 12px;">
      <div style="font-weight: 600; color: #92400e; margin-bottom: 6px;">⚠ Debug — ${escapeHTML(d.message)}</div>
      ${d.rawType ? `<div style="color: #78716c;">typeof response: <code>${escapeHTML(d.rawType)}</code></div>` : ''}
      ${d.rawKeys ? `<div style="color: #78716c;">top-level keys: <code>${escapeHTML(JSON.stringify(d.rawKeys))}</code></div>` : ''}
      ${probesHTML ? `<div style="margin-top: 10px;"><div style="font-weight: 600; color: #92400e; margin-bottom: 4px;">Diagnostic probes:</div>${probesHTML}</div>` : ''}
      <details style="margin-top: 8px;">
        <summary style="cursor: pointer; color: #78716c;">Raw sample (click to expand)</summary>
        <pre style="background: white; border: 1px solid #fcd34d; padding: 8px; margin-top: 6px; font-size: 11px; max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all;">${escapeHTML(JSON.stringify(d.sampleResponse ?? d.error, null, 2).slice(0, 4000))}</pre>
      </details>
    </div>
  `;
}

function renderSidebar() {
  const items = [
    { id: 'eagles', label: 'Eagles View', stub: true },
    { id: 'operational', label: 'Operational', stub: true },
    { id: 'resurface', label: 'Resurface', stub: false },
    { id: 'weekly', label: 'Weekly Review', stub: true },
  ];
  const generated = state.data?.generated_at
    ? state.data.generated_at.replace('T', ' ').slice(0, 16) + ' UTC'
    : '';
  return `
    <aside>
      <div class="brand">
        <div class="label">Gaia</div>
        <h1>Cockpit</h1>
        <div class="version">v0.2 · live</div>
      </div>
      <nav>
        ${items.map(it => `
          <button data-action="view" data-view="${it.id}" class="${state.view === it.id ? 'active' : ''}">
            <span>${it.label}</span>
            ${it.stub ? '<span class="stub">stub</span>' : ''}
          </button>
        `).join('')}
      </nav>
      <div class="source">
        <div>via aae-mcp:read_folder</div>
        <div>${generated}</div>
      </div>
    </aside>
  `;
}

function renderStub() {
  const labels = { eagles: 'Eagles View', operational: 'Operational', weekly: 'Weekly Review' };
  return `<div class="stub-view">${labels[state.view]} — coming next</div>`;
}

function renderResurface() {
  const captured = state.data.threads.captured || [];
  const postponed = state.data.threads.postponed || [];
  const captureInbox = state.data.special.capture_inbox || [];
  const revisit = state.data.special.revisit_inbox || [];

  const tabs = [
    { id: 'captured', label: 'Captured', count: captured.length, hint: 'needs qualification' },
    { id: 'capture-inbox', label: 'Capture Inbox', count: captureInbox.length, hint: 'uncertain items' },
    { id: 'revisit', label: 'Revisit', count: revisit.length, hint: 'links / resources' },
    { id: 'postponed', label: 'Postponed', count: postponed.length, hint: 'dormant — review periodically' },
  ];

  const showFilters = state.tab === 'captured' || state.tab === 'postponed';
  const domains = ['all', 'personal', 'professional', 'family', 'ventures', 'meta'];

  let body;
  if (state.tab === 'captured') body = renderThreads(filteredSorted(captured));
  else if (state.tab === 'postponed') body = renderThreads(filteredSorted(postponed));
  else if (state.tab === 'capture-inbox') body = renderInbox(captureInbox);
  else if (state.tab === 'revisit') body = renderRevisit(revisit);
  else body = '<div class="empty">—</div>';

  return `
    <header class="view-header">
      <h2>Resurface</h2><span class="desc">— pull what's been quiet back into view</span>
    </header>
    <div class="tabs">
      ${tabs.map(t => `
        <button class="tab ${state.tab === t.id ? 'active' : ''}" data-action="tab" data-tab="${t.id}">
          ${t.label}<span class="count">(${t.count})</span>
        </button>
      `).join('')}
    </div>
    <div class="filters">
      <span class="hint">${tabs.find(t => t.id === state.tab)?.hint || ''}</span>
      <span class="grow"></span>
      ${showFilters ? `
        <select data-action="domain">
          ${domains.map(d => `<option value="${d}" ${state.domainFilter === d ? 'selected' : ''}>${d}</option>`).join('')}
        </select>
        <select data-action="sort">
          <option value="oldest" ${state.sortMode === 'oldest' ? 'selected' : ''}>oldest first</option>
          <option value="newest" ${state.sortMode === 'newest' ? 'selected' : ''}>newest first</option>
          <option value="domain" ${state.sortMode === 'domain' ? 'selected' : ''}>by domain</option>
        </select>
      ` : ''}
    </div>
    <div class="scroll">${body}</div>
  `;
}

function filteredSorted(list) {
  let out = list;
  if (state.domainFilter !== 'all') out = out.filter(t => t.domain === state.domainFilter);
  out = [...out].sort((a, b) => {
    if (state.sortMode === 'oldest') return (a.created_on || '').localeCompare(b.created_on || '');
    if (state.sortMode === 'newest') return (b.created_on || '').localeCompare(a.created_on || '');
    if (state.sortMode === 'domain') return (a.domain || '').localeCompare(b.domain || '');
    return 0;
  });
  return out;
}

function renderThreads(list) {
  if (!list.length) return '<div class="empty">No threads match.</div>';
  return list.map(t => `
    <div class="item">
      <div class="row">
        <div class="title" title="${escapeHTML(t.file)}">${escapeHTML(prettyTitle(t))}</div>
        ${stalenessHTML(daysSince(t.created_on))}
      </div>
      <div class="meta">
        <span class="tag ${tagClass(t.domain)}">${escapeHTML(tagLabel(t))}</span>
        <span class="type">${escapeHTML(t.type || '—')}</span>
        ${t.due ? `<span class="due">due ${escapeHTML(t.due)}</span>` : ''}
        ${t.schema === 'legacy' ? '<span class="legacy">legacy schema</span>' : ''}
      </div>
      ${t.next ? `<div class="next"><span class="arrow">→ </span>${escapeHTML(t.next)}</div>` : ''}
    </div>
  `).join('');
}

function renderInbox(items) {
  if (!items.length) return '<div class="empty">Capture inbox empty.</div>';
  return items.map(item => `
    <div class="item">
      <div class="title wrap">${escapeHTML(item.text)}</div>
      ${item.context ? `<div class="next italic">${escapeHTML(item.context)}</div>` : ''}
    </div>
  `).join('');
}

function renderRevisit(items) {
  if (!items.length) return '<div class="empty">Revisit list empty.</div>';
  return items.map(item => `
    <div class="item">
      <div class="row">
        <a class="title" href="${escapeHTML(item.url)}" target="_blank" rel="noopener">${escapeHTML(item.url)}</a>
        ${item.added ? stalenessHTML(daysSince(item.added)) : ''}
      </div>
      ${item.context ? `<div class="next italic">${escapeHTML(item.context)}</div>` : ''}
    </div>
  `).join('');
}

// ============================================================
// EVENTS
// ============================================================

function attach() {
  document.querySelectorAll('[data-action="view"]').forEach(btn => {
    btn.onclick = () => { state.view = btn.dataset.view; render(); };
  });
  document.querySelectorAll('[data-action="tab"]').forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });
  document.querySelectorAll('[data-action="domain"]').forEach(sel => {
    sel.onchange = () => { state.domainFilter = sel.value; render(); };
  });
  document.querySelectorAll('[data-action="sort"]').forEach(sel => {
    sel.onchange = () => { state.sortMode = sel.value; render(); };
  });
  document.querySelectorAll('[data-action="retry"]').forEach(btn => {
    btn.onclick = () => loadData();
  });
}

// ============================================================
// INIT
// ============================================================

loadData();
</script>
</body>
</html>
